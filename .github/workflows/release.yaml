name: Release please

on:
  push:
    branches:
      - main
      - release/v[0-9]* # Something like release/v1, release/v1.0 release/v1.0.0

permissions:
  contents: write
  pull-requests: write
  actions: write
  packages: write

env:
  IMAGE_NAME: webhook-over-websocket

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      all: ${{ toJSON(steps.release.outputs) }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup app token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: generate-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_PEM }}
          owner: ${{ github.repository_owner }}
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}
          config-file: release-please/config.json
          manifest-file: release-please/manifest.json
          target-branch: ${{ github.ref_name }}
  set-tag-name:
    needs: release-please
    runs-on: ubuntu-slim
    outputs:
      tag: ${{ steps.output_tag.outputs.tag }}
    env:
      IS_RELEASED: ${{ needs.release-please.outputs.release_created }}
    steps:
      - name: tag name to release tag name
        if: env.IS_RELEASED == 'true'
        run: |
          echo "VERSION=${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_ENV"
      - name: tag name to release tag name
        if: env.IS_RELEASED != 'true'
        run: |
          echo "VERSION=${{ github.sha }}" >> "$GITHUB_ENV"
      - name: output release tag name
        id: output_tag
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "## Tag version"
            printf '`%s`\n' "${VERSION}"
          } >> "${GITHUB_STEP_SUMMARY}"

  docker-build:
    needs:
      - release-please
      - set-tag-name
    # Build each platform natively (arm64 on an ARM runner) instead of emulating with QEMU.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    env:
      IS_RELEASED: ${{ needs.release-please.outputs.release_created }}
      VERSION: ${{ needs.set-tag-name.outputs.tag }}
      PLATFORM: ${{ matrix.platform == 'linux/amd64' && 'amd64' || matrix.platform == 'linux/arm64' && 'arm64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ env.PLATFORM }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-${{ env.PLATFORM }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}-${{ env.PLATFORM }}
  combine-multi-arch-image:
    needs:
      - docker-build
      - set-tag-name
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.set-tag-name.outputs.tag }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Enable buildx
        shell: bash
        run: docker buildx install
      - name: Log in ghcr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifest to GHCR
        shell: bash
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          docker buildx imagetools create \
            -t "$IMAGE" \
            "$IMAGE-amd64" \
            "$IMAGE-arm64"

  goreleaser:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
