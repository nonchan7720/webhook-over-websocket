services:
  service:
    image: webhook-over-websocket-local
    build:
      context: ../../
    command:
      - webhook-over-websocket
      - server
      - --peer-domain
      - service
      - --cleanup-duration
      - 1m
      - --log-level
      - INFO
    deploy:
      replicas: 3
  traefik:
    image: traefik:v3.6.8@sha256:90099f8948c828ecf0ababd711a4359a2443eba12261c1df2f548a3b1d815938
    command:
      - --configFile
      - /etc/traefik/config/static.yaml
    ports:
      - 18081:18080
      - 18082:8080
    volumes:
      - ./traefik/static.yaml:/etc/traefik/config/static.yaml
      - ./traefik/dynamic/:/etc/traefik/config/dynamic/
