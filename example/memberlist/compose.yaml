services:
  service:
    image: webhook-over-websocket-local
    build:
      context: ../../
    command:
      - webhook-over-websocket
      - server
      - --peer-domain
      - service
      - --cleanup-duration
      - 1m
      - --log-level
      - INFO
    deploy:
      replicas: 3
  traefik:
    image: traefik:v3.7.15@sha256:0f6150202bc1fed72a7bd2107460eaa510e5b8a905f3fdb5b84f2c8619c33368
    command:
      - --configFile
      - /etc/traefik/config/static.yaml
    ports:
      - 18081:18080
      - 18082:8080
    volumes:
      - ./traefik/static.yaml:/etc/traefik/config/static.yaml
      - ./traefik/dynamic/:/etc/traefik/config/dynamic/
