services:
  service:
    image: webhook-over-websocket-local
    build:
      context: ../../
    command:
      - webhook-over-websocket
      - server
      - --peer-domain
      - service
      - --cleanup-duration
      - 1m
      - --log-level
      - INFO
    deploy:
      replicas: 3
  traefik:
    image: traefik:v3.7.17@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
    command:
      - --configFile
      - /etc/traefik/config/static.yaml
    ports:
      - 18081:18080
      - 18082:8080
    volumes:
      - ./traefik/static.yaml:/etc/traefik/config/static.yaml
      - ./traefik/dynamic/:/etc/traefik/config/dynamic/
