services:
  service:
    image: webhook-over-websocket-local
    build:
      context: ../../
    command:
      - webhook-over-websocket
      - server
      - --peer-domain
      - service
      - --cleanup-duration
      - 1m
      - --log-level
      - INFO
    deploy:
      replicas: 3
  traefik:
    image: traefik:v3.7.18@sha256:9c437ac4f09ce6f4980a8544902d3475fdf70a1a7c578729581d2535dfa7d635
    command:
      - --configFile
      - /etc/traefik/config/static.yaml
    ports:
      - 18081:18080
      - 18082:8080
    volumes:
      - ./traefik/static.yaml:/etc/traefik/config/static.yaml
      - ./traefik/dynamic/:/etc/traefik/config/dynamic/
